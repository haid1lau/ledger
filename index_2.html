<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF7;--ink:#111;--muted:#6B6B66;--line:#E5E3DC;--card:#fff;--accent:#5B4BFF;--soft:#ECEAFF;--bad:#D6336C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 64px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0 32px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600}
.eyebrow{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:18px}
h1{font-size:60px;line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:0 0 12px}
.hero p{font-size:18px;color:var(--muted);max-width:560px;margin:0 0 36px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}
.stat .num{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .lbl{margin-top:8px;font-size:14px;color:var(--muted)}
.stat.dark{background:var(--ink);border-color:var(--ink)}.stat.dark .num{color:#fff}.stat.dark .lbl{color:#BDBDB6}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tab{border-radius:999px;background:#fff;border:1px solid #C9C6BC;color:#111;font:600 14px Inter,system-ui,sans-serif;padding:8px 20px;cursor:pointer}
.tab:hover{color:var(--accent)}
.tab[aria-selected=true]{background:#111;border-color:#111;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:24px}
h3{margin:0 0 16px;font-weight:800;letter-spacing:-.02em}
label{display:block;font-size:14px;font-weight:600;margin-bottom:14px}
input,select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #C9C6BC;border-radius:12px;font:400 15px Inter,system-ui,sans-serif;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.btn{border-radius:999px;background:var(--ink);color:#fff;border:none;padding:10px 24px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.btn:hover{background:var(--accent)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #C9C6BC;margin-left:8px}
.hint{color:var(--muted);font-size:14px;margin:12px 0 0}
.row{display:grid;grid-template-columns:2.4fr 1.3fr 1fr 1fr auto;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px;margin-bottom:10px}
.row.head{background:none;border:none;padding:0 20px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.row.cat{grid-template-columns:1.4fr 3fr 1.6fr}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{color:var(--muted);white-space:nowrap}
.amt{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-weight:400}
.chip{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.acts{display:flex;gap:6px;justify-content:flex-end}
.mini{border:1px solid #C9C6BC;background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font:600 12px Inter,system-ui,sans-serif;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}.mini.danger:hover{border-color:var(--bad);color:var(--bad)}
.bar{height:10px;background:#EEEDE7;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over span{background:var(--bad)}.over-txt{color:var(--bad);font-size:12px;font-weight:600}
.empty{color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}
@media(max-width:720px){h1{font-size:40px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}
.row{grid-template-columns:1.6fr 1fr 1fr}.row .date,.row.head div:nth-child(3){display:none}.acts{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><div class="brand">Ledger</div><div class="pill" id="monthPill"></div></div>
  <div class="hero"><span class="eyebrow">Personal expense tracker</span><h1>Know where every dollar goes.</h1><p>Log spending, set budgets per category, and see how the month is going at a glance.</p></div>
  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="add">Add expense</button>
    <button class="tab" role="tab" data-tab="expenses">Expenses</button>
    <button class="tab" role="tab" data-tab="categories">Categories</button>
    <button class="tab" role="tab" data-tab="summary">Summary</button>
  </div>

  <section id="p-add">
    <form id="expForm" class="card">
      <h3 id="expTitle">New expense</h3>
      <label>Name<input id="eName" placeholder="e.g. Kopi and kaya toast"></label>
      <div class="cols">
        <label>Category<select id="eCat"></select></label>
        <label>Amount ($)<input id="eAmt" type="number" min="0.01" step="0.01" required></label>
        <label>Date<input id="eDate" type="date" required></label>
      </div>
      <button class="btn" type="submit" id="eSave">Save expense</button><button class="btn ghost" type="button" id="eCancel" hidden>Cancel</button>
      <p class="hint" id="eHint" hidden>Create a category first in the Categories tab.</p>
    </form>
  </section>

  <section id="p-expenses" hidden><div id="expList"></div></section>

  <section id="p-categories" hidden>
    <div id="catList"></div>
    <form id="catForm" class="card">
      <h3 id="catTitle">New category</h3>
      <div class="cols" style="grid-template-columns:2fr 1fr">
        <label>Category name<input id="cName" required></label>
        <label>Monthly budget ($)<input id="cBudget" type="number" min="0" step="1" value="0"></label>
      </div>
      <button class="btn" type="submit" id="cSave">Add category</button><button class="btn ghost" type="button" id="cCancel" hidden>Cancel</button>
    </form>
  </section>

  <section id="p-summary" hidden>
    <label style="max-width:240px">Month<select id="sMonth"></select></label>
    <div id="sumList"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'ledger-v1';
let S = { cats: [], exps: [], next: 1 };
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const catName = id => (S.cats.find(c => c.id === id) || { name: '?' }).name;
const byName = (a, b) => a.name.localeCompare(b.name);
let editExp = null, editCat = null;

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

function showTab(name) {
  ['add', 'expenses', 'categories', 'summary'].forEach(t => $('p-' + t).hidden = t !== name);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
}

function render() {
  const m = today().slice(0, 7), mine = S.exps.filter(e => e.date.startsWith(m));
  const spent = mine.reduce((a, e) => a + e.amount, 0), budget = S.cats.reduce((a, c) => a + c.budget, 0);
  $('monthPill').textContent = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' });
  $('stats').innerHTML =
    `<div class="stat dark"><div class="num">${money(spent)}</div><div class="lbl">Spent this month</div></div>` +
    `<div class="stat"><div class="num">${money(budget)}</div><div class="lbl">Total monthly budget</div></div>` +
    `<div class="stat"><div class="num">${money(budget - spent)}</div><div class="lbl">Remaining</div></div>` +
    `<div class="stat"><div class="num">${mine.length}</div><div class="lbl">Expenses logged</div></div>`;

  // category dropdown
  const sel = $('eCat'), cur = sel.value;
  sel.innerHTML = S.cats.slice().sort(byName).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  if (cur) sel.value = cur;
  $('eHint').hidden = S.cats.length > 0; $('eSave').disabled = !S.cats.length;

  // expenses list
  const sorted = S.exps.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $('expList').innerHTML = sorted.length
    ? '<div class="row head"><div>Name</div><div>Category</div><div>Date</div><div class="amt">Amount</div><div></div></div>' +
      sorted.map(e => `<div class="row"><div class="name">${e.note ? esc(e.note) : '<span class="muted">Untitled</span>'}</div>` +
        `<div><span class="chip">${esc(catName(e.cat))}</span></div><div class="date">${e.date}</div><div class="amt">${money(e.amount)}</div>` +
        `<div class="acts"><button class="mini" data-act="editExp" data-id="${e.id}">Edit</button>` +
        `<button class="mini danger" data-act="delExp" data-id="${e.id}">Delete</button></div></div>`).join('')
    : '<p class="empty">No expenses yet.</p>';

  // categories list
  const cats = S.cats.slice().sort(byName);
  $('catList').innerHTML = cats.length
    ? '<div class="row head"><div>Category</div><div>Monthly budget</div><div>Expenses</div><div></div><div></div></div>' +
      cats.map(c => `<div class="row"><div class="name">${esc(c.name)}</div><div>${money(c.budget)}</div>` +
        `<div class="date">${S.exps.filter(e => e.cat === c.id).length}</div><div></div>` +
        `<div class="acts"><button class="mini" data-act="editCat" data-id="${c.id}">Rename</button>` +
        `<button class="mini danger" data-act="delCat" data-id="${c.id}">Delete</button></div></div>`).join('')
    : '<p class="empty">No categories yet. Add one below.</p>';

  // summary
  const ms = $('sMonth'), curM = ms.value || m;
  const months = [...new Set([m, ...S.exps.map(e => e.date.slice(0, 7))])].sort().reverse();
  ms.innerHTML = months.map(x => `<option>${x}</option>`).join(''); ms.value = months.includes(curM) ? curM : m;
  $('sumList').innerHTML = cats.length ? cats.map(c => {
    const sp = S.exps.filter(e => e.cat === c.id && e.date.startsWith(ms.value)).reduce((a, e) => a + e.amount, 0);
    const over = c.budget > 0 && sp > c.budget, pct = c.budget > 0 ? Math.min(sp / c.budget * 100, 100) : 0;
    return `<div class="row cat"><div class="name">${esc(c.name)}</div><div class="bar${over ? ' over' : ''}"><span style="width:${pct}%"></span></div>` +
      `<div class="amt">${money(sp)} <span class="muted">/ ${money(c.budget)}</span>${over ? `<div class="over-txt">Over by ${money(sp - c.budget)}</div>` : ''}</div></div>`;
  }).join('') : '<p class="empty">No categories yet.</p>';
}

function resetExpForm() {
  editExp = null; $('expForm').reset(); $('eDate').value = today();
  $('expTitle').textContent = 'New expense'; $('eSave').textContent = 'Save expense'; $('eCancel').hidden = true;
}
function resetCatForm() {
  editCat = null; $('catForm').reset(); $('cBudget').value = 0;
  $('catTitle').textContent = 'New category'; $('cSave').textContent = 'Add category'; $('cCancel').hidden = true;
}

$('expForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const rec = { cat: +$('eCat').value, amount: parseFloat($('eAmt').value), date: $('eDate').value, note: $('eName').value.trim() };
  if (!S.cats.some(c => c.id === rec.cat) || !(rec.amount > 0) || !rec.date) return toast('Please fill in all fields.');
  if (editExp) Object.assign(S.exps.find(e => e.id === editExp), rec);
  else S.exps.push({ id: S.next++, ...rec });
  toast(editExp ? 'Expense updated.' : 'Expense added.');
  save(); resetExpForm(); render();
});

$('catForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const name = $('cName').value.trim(), budget = Math.max(0, parseFloat($('cBudget').value) || 0);
  if (!name) return toast('Name can\'t be empty.');
  if (S.cats.some(c => c.id !== editCat && c.name.toLowerCase() === name.toLowerCase())) return toast('That category already exists.');
  if (editCat) Object.assign(S.cats.find(c => c.id === editCat), { name, budget });
  else S.cats.push({ id: S.next++, name, budget });
  toast(editCat ? 'Category updated.' : 'Category added.');
  save(); resetCatForm(); render();
});

$('eCancel').onclick = resetExpForm;
$('cCancel').onclick = resetCatForm;
$('sMonth').onchange = render;

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-tab]');
  if (!t) return;
  if (t.dataset.tab) return showTab(t.dataset.tab);
  const id = +t.dataset.id, act = t.dataset.act;

  if (act === 'editExp') {
    const e = S.exps.find(x => x.id === id); editExp = id;
    $('eName').value = e.note; $('eCat').value = e.cat; $('eAmt').value = e.amount; $('eDate').value = e.date;
    $('expTitle').textContent = 'Edit expense'; $('eSave').textContent = 'Save changes'; $('eCancel').hidden = false;
    return showTab('add');
  }
  if (act === 'editCat') {
    const c = S.cats.find(x => x.id === id); editCat = id;
    $('cName').value = c.name; $('cBudget').value = c.budget;
    $('catTitle').textContent = 'Rename category'; $('cSave').textContent = 'Save category'; $('cCancel').hidden = false;
    return $('cName').focus();
  }
  if (act === 'delExp' || act === 'delCat') {           // two-step delete: first click arms, second confirms
    if (!t.dataset.arm) {
      t.dataset.arm = 1; const old = t.textContent; t.textContent = 'Sure?';
      return void setTimeout(() => { delete t.dataset.arm; t.textContent = old; }, 2500);
    }
    if (act === 'delExp') { S.exps = S.exps.filter(x => x.id !== id); toast('Expense deleted.'); }
    else if (S.exps.some(x => x.cat === id)) return toast('This category still has expenses. Move or delete them first.');
    else { S.cats = S.cats.filter(x => x.id !== id); toast('Category deleted.'); }
    save(); render();
  }
});

resetExpForm(); showTab('add'); render();
</script>
</body>
</html>
