<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<meta name="theme-color" content="#07070B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070B;--s1:#101018;--s2:#16161F;--s3:#1F1F2A;--line:#23232E;--line2:#2C2C3A;
  --ink:#F4F4EF;--ink2:#B5B5C2;--muted:#9A9AA8;--faint:#6E6E7C;
  --acc:#D7FF3D;--acc-soft:#1A2108;--bad:#FF7A59;--bad-soft:#1F120D;--bad-line:#5A2A1C;--bad-ink:#FFB29E;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;--sans:Geist,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
::selection{background:var(--acc);color:#07070B}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- ambient background ---------- */
.bg-grid{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,#1C1C26 1px,transparent 0);background-size:28px 28px;opacity:0;animation:fadeIn 1.2s .1s var(--out) forwards}
.spot{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px circle at var(--cx,50%) var(--cy,-20%),rgba(215,255,61,.06),transparent 60%)}
@keyframes fadeIn{to{opacity:.75}}

.app{position:relative;max-width:1280px;margin:0 auto;padding:24px 32px 96px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:40px;animation:drop .9s var(--out) both}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}
.brand{display:flex;align-items:center;gap:12px;font:800 22px var(--disp);letter-spacing:-.03em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;transition:transform .6s var(--spring)}
.brand:hover .logo{transform:rotate(-12deg) scale(1.08)}
.nav{position:relative;display:flex;gap:2px;padding:5px;border:1px solid var(--line);border-radius:999px;background:#0E0E15}
.nav-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--ink);transition:transform .55s var(--spring),width .55s var(--spring)}
.nav-btn{position:relative;z-index:1;border:0;background:none;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;transition:color .3s}
.nav-btn:hover{color:var(--ink)}
.nav-btn[aria-selected=true]{color:#07070B;font-weight:600}
.top-acts{display:flex;align-items:center;gap:10px}
.kbd-btn{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0E0E15;color:var(--muted);font:500 13px var(--mono);display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s,color .2s}
.kbd-btn:hover{border-color:var(--line2);color:var(--ink)}

/* ---------- buttons ---------- */
.btn{--tx:0px;--ty:0px;--s:1;height:44px;padding:0 20px;border-radius:12px;border:1px solid transparent;font:600 14px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transform:translate(var(--tx),var(--ty)) scale(var(--s));transition:transform .45s var(--spring),background .2s,border-color .2s,color .2s,box-shadow .3s}
.btn:active{--s:.95;transition-duration:.12s}
.btn.primary{background:var(--acc);color:#07070B}
.btn.primary:hover{box-shadow:0 10px 40px -8px rgba(215,255,61,.55)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.danger{background:transparent;border-color:var(--bad-line);color:var(--bad-ink)}
.btn.big{height:60px;border-radius:18px;font-size:16px;padding:0 26px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn kbd{font:500 12px var(--mono);padding:3px 7px;border-radius:6px;background:rgba(7,7,11,.14)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,border-color .2s,transform .4s var(--spring)}
.icon-btn:hover{color:var(--ink);border-color:var(--line2)}
.icon-btn.armed{color:var(--bad-ink);border-color:var(--bad-line);background:var(--bad-soft)}
.link{border:0;background:none;color:var(--acc);font-size:14px;font-weight:500;cursor:pointer;padding:6px 0}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- views ---------- */
.view{display:flex;flex-direction:column;gap:32px}
.view.leaving{animation:leave .22s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateY(-8px);filter:blur(6px)}}
.view.entering [data-in]{animation:rise .8s var(--out) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(8px)}}
.stagger>*{animation:rise .7s var(--out) both;animation-delay:calc(var(--i,0) * 35ms)}

.view-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.title{margin:0;font:800 clamp(48px,7vw,80px)/.92 var(--disp);letter-spacing:-.05em}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center}
.hero-l{display:flex;flex-direction:column;gap:18px;min-width:0}
.chip-month{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.chip-month .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(215,255,61,.6);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(215,255,61,0)}100%{box-shadow:0 0 0 0 rgba(215,255,61,0)}}
.hero-lbl{font-size:15px;color:var(--muted)}
.hero-num{font:800 clamp(52px,10vw,128px)/1 var(--disp);letter-spacing:-.055em;display:flex;align-items:flex-start;white-space:nowrap;font-variant-numeric:tabular-nums;margin:-4px 0 -6px}
.od-col{display:inline-block;height:1em;overflow:hidden}
.od-strip{display:flex;flex-direction:column;transition:transform 1.4s var(--out)}
.od-strip span,.od-sep{display:block;height:1em;line-height:1em}
.od-sep{display:inline-block}
.dim{color:#4A4A58}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;color:var(--ink2)}
.pct-chip{padding:6px 12px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:600;transition:background .4s,color .4s}
.pct-chip.over{background:var(--bad-soft);color:var(--bad-ink)}
.meter{display:flex;flex-direction:column;gap:8px;max-width:520px}
.meter-track{position:relative;height:8px;border-radius:999px;background:#1A1A24}
.meter-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--acc);transition:width 1.6s var(--out),background .4s}
.meter-fill.over{background:var(--bad)}
.meter-pace{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:2px;background:var(--ink);opacity:.8;left:0;transition:left 1.6s var(--out)}
.meter-scale{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--faint)}

.orb-stage{position:relative;height:480px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.orb-stage.on-moon{cursor:pointer}
.moon-tip{position:absolute;left:0;top:0;z-index:2;pointer-events:none;display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:999px;background:rgba(16,16,24,.9);border:1px solid var(--c);box-shadow:0 0 24px -6px var(--c);backdrop-filter:blur(8px);white-space:nowrap;opacity:0;transition:opacity .2s}
.moon-tip.show{opacity:1}
.moon-tip .sw{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.moon-tip b{font:600 14px var(--sans)}
.moon-tip span{font:400 12px var(--mono);color:var(--muted)}
.moon-tip .in{display:flex;align-items:center;gap:10px;transform:scale(.85);transition:transform .35s var(--spring)}
.moon-tip.show .in{transform:none}
.orb-stage:active{cursor:grabbing}
.orb-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.orb-cap{position:absolute;right:12px;bottom:16px;padding:10px 14px;border-radius:14px;background:rgba(16,16,24,.85);border:1px solid var(--line);font:400 12px var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(8px);pointer-events:none}
.orb-cap b{color:var(--ink);font-weight:500}
.orb-css{position:absolute;inset:0;display:none;place-items:center}
.no-gl .orb-css{display:grid}
.orb-ball{position:relative;width:300px;height:300px;border-radius:50%;overflow:hidden;background:#0d0d14;box-shadow:inset 0 0 60px rgba(255,255,255,.06),0 0 120px rgba(215,255,61,.18);animation:bob 6s ease-in-out infinite}
.orb-liq{position:absolute;left:-10%;right:-10%;bottom:0;height:var(--lvl,0%);background:radial-gradient(circle at 40% 10%,#F8FFD6,var(--acc) 30%,#3d500a 100%);transition:height 1.6s var(--out)}
@keyframes bob{50%{transform:translateY(-10px)}}

/* ---------- stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{position:relative;padding:22px;border-radius:22px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;overflow:hidden}
.tilt{--rx:0deg;--ry:0deg;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .6s var(--out),border-color .3s;transform-style:preserve-3d;will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.07),transparent 45%);opacity:0;transition:opacity .4s;pointer-events:none}
.tilt:hover{border-color:var(--line2)}
.tilt:hover::after{opacity:1}
.stat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stat-top .mono{font:500 12px var(--mono);color:var(--ink2)}
.stat-num{font:700 36px var(--disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:4px;height:28px}
.spark i{flex:1;border-radius:3px;background:#262632;transform-origin:bottom;animation:grow .9s var(--out) both;animation-delay:calc(var(--j) * 30ms + 300ms)}
.spark i.hi{background:var(--acc)}
@keyframes grow{from{transform:scaleY(0)}}

/* ---------- panels ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{padding:24px;border-radius:26px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.panel h2{margin:0;font:700 22px var(--disp);letter-spacing:-.02em}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px}
.side{gap:20px}

.erow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:16px;transition:background .25s,transform .4s var(--spring)}
.erow:hover{background:var(--s2)}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 15px var(--disp);background:color-mix(in srgb,var(--c) 14%,#0B0B10);color:var(--c)}
.e-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.e-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-amt{font:500 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:3px;background:#15151d}
.stack i{display:block;height:100%;transform-origin:left;animation:growX 1.1s var(--out) both;animation-delay:calc(var(--j) * 80ms + 200ms)}
@keyframes growX{from{transform:scaleX(0)}}
.legend{display:flex;flex-direction:column;gap:14px}
.lg{display:flex;align-items:center;gap:12px;font-size:14px}
.lg .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.lg .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .p{font-family:var(--mono);color:var(--muted)}
.lg .a{font-family:var(--mono);width:96px;text-align:right}
.alert{padding:14px 16px;border-radius:16px;background:var(--bad-soft);border:1px solid #4A2418;color:var(--bad-ink);font-size:14px;line-height:1.45}
.ok-note{padding:14px 16px;border-radius:16px;background:var(--acc-soft);border:1px solid #2E3A0E;color:#E6FF9A;font-size:14px;line-height:1.45}

.welcome{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:12px 4px 4px}
.welcome p{margin:0;color:var(--ink2);line-height:1.55;max-width:460px}
.welcome .row{display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);padding:12px 4px;margin:0}

/* ---------- expenses view ---------- */
.search{position:relative;display:flex;align-items:center;min-width:min(100%,320px)}
.search svg{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.inp{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:#0B0B11;color:var(--ink);font:400 15px var(--sans);transition:border-color .2s,box-shadow .3s}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(215,255,61,.12)}
.inp::placeholder{color:#5C5C6A}
.search .inp{padding-left:42px;height:48px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fchip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink2);font:500 14px var(--sans);display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:all .25s}
.fchip:hover{color:var(--ink);border-color:var(--muted)}
.fchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#07070B}
.fchip .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.day{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.day-h{display:flex;justify-content:space-between;padding:0 12px 6px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.erow.full{grid-template-columns:44px minmax(0,1fr) auto auto;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.erow.full:hover{background:var(--s2);transform:translateX(4px)}
.acts{display:flex;gap:6px;opacity:.0;transition:opacity .2s}
.erow:hover .acts,.erow:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.tag{display:inline-flex;align-items:center;gap:6px}
.tag .sw{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* ---------- budgets ---------- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.bcard{position:relative;padding:24px;border-radius:28px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:22px;overflow:hidden}
.bcard.over{border-color:var(--bad-line)}
.bcard.over.shake{animation:shake .6s var(--out) .5s}
@keyframes shake{15%{transform:translateX(-7px) rotate(-.6deg)}30%{transform:translateX(6px) rotate(.5deg)}45%{transform:translateX(-4px)}60%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bname{font:700 22px var(--disp);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.bsub{font:400 13px var(--mono);color:var(--muted)}
.bbody{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:120px;height:120px;flex-shrink:0}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:var(--s3)}
.ring .val{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--out);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 50%,transparent))}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-c b{font:800 26px var(--disp);letter-spacing:-.04em}
.ring-c span{font:400 11px var(--mono);color:var(--muted)}
.bnums{display:flex;flex-direction:column;gap:6px;min-width:0}
.bnums .big{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
.bnums .of{font-size:13px;color:var(--muted)}
.bnums .st{font-size:13px;font-weight:600;color:var(--ink2)}
.bcard.over .st{color:var(--bad-ink)}
.bacts{display:flex;gap:6px}
.newcard{min-height:290px;border-radius:28px;border:1.5px dashed var(--line2);background:transparent;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;font:500 15px var(--sans);transition:border-color .3s,color .3s,background .3s}
.newcard:hover{border-color:var(--acc);color:var(--acc);background:rgba(215,255,61,.03)}
.newcard .plus{width:56px;height:56px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;transition:transform .6s var(--spring)}
.newcard:hover .plus{transform:rotate(90deg) scale(1.08)}

/* ---------- summary ---------- */
.seg-row{display:flex;gap:4px;padding:5px;border-radius:999px;border:1px solid var(--line);background:#0E0E15;overflow-x:auto;max-width:100%;scrollbar-width:none}
.mbtn{height:40px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--ink2);font:500 13px var(--mono);cursor:pointer;white-space:nowrap;transition:background .3s,color .3s}
.mbtn[aria-pressed=true]{background:var(--ink);color:#07070B}
.sum-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sum-k{padding:22px;border-radius:22px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sum-k b{font:700 36px var(--disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.sum-k span{font-size:13px;color:var(--muted)}
.daily{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:24px}
.dbar{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}
.dbar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:#2A2A36;transform-origin:bottom;animation:grow 1s var(--out) both;animation-delay:calc(var(--j) * 18ms);transition:background .2s}
.dbar.has i{background:color-mix(in srgb,var(--acc) 70%,#2A2A36)}
.dbar.today i{background:var(--acc)}
.dbar:hover i{background:var(--ink)}
.dbar .tip{position:absolute;bottom:calc(var(--h) + 8px);left:50%;transform:translate(-50%,6px);padding:6px 10px;border-radius:8px;background:var(--ink);color:#07070B;font:500 12px var(--mono);white-space:nowrap;opacity:0;pointer-events:none;transition:all .25s var(--spring);z-index:2}
.dbar:hover .tip{opacity:1;transform:translate(-50%,0)}
.daxis{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--faint);padding-top:8px}
.hbar{display:grid;grid-template-columns:minmax(90px,160px) minmax(0,1fr) auto;gap:16px;align-items:center;padding:10px 0}
.hbar .n{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-width:0;overflow:hidden}
.hbar .n .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex-shrink:0}
.htrack{position:relative;height:12px;border-radius:999px;background:#1A1A24;overflow:hidden}
.htrack i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c);width:0;transition:width 1.4s var(--out)}
.htrack.over i{background:var(--bad)}
.hbar .a{font:500 14px var(--mono);text-align:right;white-space:nowrap}
.hbar .a small{color:var(--muted);font-size:12px}
.hbar .over-t{display:block;color:var(--bad-ink);font-size:12px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.sheet-bg{position:absolute;inset:0;background:rgba(5,5,8,.6);backdrop-filter:blur(0px);opacity:0;transition:opacity .35s,backdrop-filter .35s}
.sheet.open .sheet-bg{opacity:1;backdrop-filter:blur(10px)}
.sheet-panel{position:relative;width:min(1040px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:32px;border-radius:32px;background:var(--s1);border:1px solid var(--line2);box-shadow:0 40px 120px -20px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:26px;opacity:0;transform:translateY(40px) scale(.96);transition:opacity .3s,transform .55s var(--spring)}
.sheet.open .sheet-panel{opacity:1;transform:none}
.sheet-panel.narrow{width:min(560px,100%)}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-top h2{margin:0;font:700 24px var(--disp);letter-spacing:-.02em}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.exp-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px}
.exp-main{display:flex;flex-direction:column;gap:26px;min-width:0}
.amt-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.amt-row{display:flex;align-items:baseline;justify-content:center;max-width:100%}
.amt-row .cur{font:800 56px var(--disp);color:#4A4A58;letter-spacing:-.05em;margin-right:12px}
#eAmt{background:transparent;border:0;outline:0;color:var(--ink);font:800 clamp(72px,9vw,112px)/1 var(--disp);letter-spacing:-.055em;padding:0;width:4ch;min-width:2ch;max-width:100%;text-align:left;caret-color:var(--acc);font-variant-numeric:tabular-nums}
#eAmt::placeholder{color:#2E2E3A}
#eAmt.pop{animation:pop .25s var(--spring)}
@keyframes pop{50%{transform:scale(1.04)}}
.amt-wrap.bad #eAmt{animation:shake .45s}
.field{display:flex;flex-direction:column;gap:10px;min-width:0}
.flabel{font-size:14px;font-weight:600}
.cat-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cp{min-height:62px;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:#0B0B11;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;transition:border-color .25s,background .25s,transform .45s var(--spring)}
.cp:hover{border-color:var(--line2);transform:translateY(-2px)}
.cp[aria-checked=true]{border-color:var(--c);background:#191922}
.cp .ball{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 35%,#0B0B10 120%);transition:box-shadow .3s,transform .5s var(--spring)}
.cp[aria-checked=true] .ball{box-shadow:0 0 18px var(--c);transform:scale(1.12)}
.cp .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cp .t span:first-child{font:500 14px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .t span:last-child{font:400 11px var(--mono);color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.when{display:flex;gap:8px;flex-wrap:wrap}
.seg{height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:#0B0B11;color:var(--ink2);font:500 14px var(--sans);cursor:pointer;transition:all .25s}
.seg[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.inp.date{width:auto;flex:1;min-width:150px}
.impact{padding:24px;border-radius:24px;background:#0B0B11;border:1px solid var(--line);display:flex;flex-direction:column;gap:18px;align-self:start}
.imp-row{display:flex;align-items:center;gap:18px}
.imp-ring{position:relative;width:96px;height:96px;flex-shrink:0}
.imp-ring svg{transform:rotate(-90deg)}
.imp-ring .val{transition:stroke-dashoffset .8s var(--out),stroke .3s}
.imp-ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--disp)}
.imp-name{font:700 22px var(--disp);letter-spacing:-.02em}
.imp-note{font-size:14px;color:var(--ink2);line-height:1.45}
.imp-note.over{color:var(--bad-ink)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-family:var(--mono)}
.hr{height:1px;background:var(--line)}
.hint{margin:0;color:var(--muted);font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swb{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 35%,#0B0B10 120%);cursor:pointer;transition:transform .4s var(--spring),border-color .2s}
.swb:hover{transform:scale(1.1)}
.swb[aria-checked=true]{border-color:var(--ink);transform:scale(1.12)}

/* ---------- palette ---------- */
.sheet.pal{place-items:start center;padding-top:14vh}
.pal-panel{position:relative;width:min(620px,100%);border-radius:24px;background:var(--s1);border:1px solid var(--line2);box-shadow:0 40px 120px -20px rgba(0,0,0,.8);overflow:hidden;opacity:0;transform:translateY(-16px) scale(.97);transition:opacity .25s,transform .5s var(--spring)}
.sheet.open .pal-panel{opacity:1;transform:none}
.pal-in{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:400 17px var(--sans)}
.pal-list{max-height:50vh;overflow:auto;padding:8px}
.pi{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:12px;background:none;cursor:pointer;text-align:left;font-size:15px}
.pi[aria-selected=true]{background:var(--s3)}
.pi .k{margin-left:auto;font:400 12px var(--mono);color:var(--faint)}
.pi .sw{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.pal-g{padding:10px 14px 4px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* ---------- coin / burst / toast ---------- */
.coin{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;z-index:90;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 38%,#151515 130%);box-shadow:0 0 30px var(--c),inset 0 0 0 2px rgba(255,255,255,.35)}
.coin::after{content:"$";position:absolute;inset:0;display:grid;place-items:center;font:800 16px var(--disp);color:rgba(7,7,11,.75)}
.spark-p{position:fixed;left:0;top:0;width:6px;height:6px;margin:-3px;border-radius:50%;z-index:89;pointer-events:none;background:var(--c);box-shadow:0 0 10px var(--c)}
.toast{position:fixed;left:50%;bottom:28px;z-index:95;display:flex;align-items:center;gap:10px;padding:12px 18px 12px 14px;border-radius:999px;background:var(--ink);color:#07070B;font-weight:600;font-size:14px;transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;transition:transform .5s var(--spring),opacity .25s}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.toast .tdot{width:22px;height:22px;border-radius:50%;background:var(--acc);display:grid;place-items:center}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .hero,.split,.exp-grid{grid-template-columns:1fr}
  .orb-stage{height:380px;order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .app{padding:16px 16px 120px}
  .top{margin-bottom:24px}
  .nav{order:3;width:100%;justify-content:space-between}
  .nav{gap:0}
  .nav-btn{padding:10px 4px;flex:1;font-size:13px}
  .search{width:100%}
  .erow.full .acts .icon-btn{width:36px;height:36px}
  .kbd-btn{display:none}
  .orb-stage{height:300px}
  .stats,.sum-top,.two{grid-template-columns:1fr 1fr}
  .sum-top>:last-child{grid-column:1/-1}
  .two{grid-template-columns:1fr}
  .stat-num,.sum-k b{font-size:28px}
  .stat{padding:18px}
  .stat-top{flex-direction:column;align-items:flex-start;gap:4px}
  .erow.full{grid-template-columns:44px minmax(0,1fr) auto}
  .erow.full .acts{grid-column:2/-1;grid-row:2;opacity:1}
  .erow.full .e-amt{grid-column:3;grid-row:1}
  .sheet{padding:0;place-items:end stretch}
  .sheet-panel{border-radius:28px 28px 0 0;padding:22px 16px;max-height:94vh;transform:translateY(100%)}
  .sheet.pal{padding:12px}
  .hbar{grid-template-columns:1fr auto}
  .hbar .htrack{grid-column:1/-1;grid-row:2}
  .amt-row .cur{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="spot" id="spot" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#07070B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V5"/><path d="M5 19h14"/><path d="M9 15l4-5 3 3 4-6"/></svg></div>
      Ledger
    </div>
    <nav class="nav" id="nav" role="tablist" aria-label="Sections">
      <span class="nav-ind" id="navInd" aria-hidden="true"></span>
      <button class="nav-btn" role="tab" data-view="overview">Overview</button>
      <button class="nav-btn" role="tab" data-view="expenses">Expenses</button>
      <button class="nav-btn" role="tab" data-view="budgets">Budgets</button>
      <button class="nav-btn" role="tab" data-view="summary">Summary</button>
    </nav>
    <div class="top-acts">
      <button class="kbd-btn" data-act="palette" aria-label="Open command palette">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span id="kbdHint">⌘K</span>
      </button>
      <button class="btn primary mag" data-act="newExp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New expense
      </button>
    </div>
  </header>

  <main>
    <!-- OVERVIEW -->
    <section class="view" id="v-overview" role="tabpanel" aria-label="Overview">
      <div class="hero">
        <div class="hero-l">
          <div class="chip-month" data-in><span class="dot"></span><span id="monthChip"></span></div>
          <div class="hero-lbl" data-in>Spent this month</div>
          <div class="hero-num" id="heroNum" data-in role="text"></div>
          <div class="hero-meta" data-in><span class="pct-chip" id="pctChip"></span><span id="heroSub"></span></div>
          <div class="meter" data-in>
            <div class="meter-track"><div class="meter-fill" id="meterFill"></div><div class="meter-pace" id="meterPace" title="Where you'd be at an even pace"></div></div>
            <div class="meter-scale"><span>$0</span><span id="paceLbl"></span><span id="budgetLbl"></span></div>
          </div>
        </div>
        <div class="orb-stage" id="orbStage" data-in aria-label="Budget orb: fill level shows the share of your monthly budget spent" role="img">
          <canvas id="orbCanvas"></canvas>
          <div class="orb-css"><div class="orb-ball"><div class="orb-liq" id="orbLiq"></div></div></div>
          <div class="moon-tip" id="moonTip" aria-hidden="true"><div class="in"><span class="sw"></span><b id="mtName"></b><span id="mtAmt"></span></div></div>
          <div class="orb-cap"><b>Budget orb</b><span id="orbCap"></span></div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="split">
        <div class="panel" data-in>
          <div class="panel-h"><h2>Recent</h2><button class="link" data-go="expenses" id="viewAll">View all</button></div>
          <div id="recent"></div>
        </div>
        <div class="panel side" data-in>
          <h2>Where it went</h2>
          <div id="where"></div>
        </div>
      </div>
    </section>

    <!-- EXPENSES -->
    <section class="view" id="v-expenses" role="tabpanel" aria-label="Expenses" hidden>
      <div class="view-h" data-in>
        <h1 class="title">Expenses</h1>
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="inp" id="q" placeholder="Search expenses" aria-label="Search expenses" autocomplete="off">
        </label>
      </div>
      <div class="filters" id="filters" data-in></div>
      <div id="expList" data-in></div>
    </section>

    <!-- BUDGETS -->
    <section class="view" id="v-budgets" role="tabpanel" aria-label="Budgets" hidden>
      <div class="view-h" data-in>
        <h1 class="title">Budgets</h1>
        <button class="btn ghost" data-act="newCat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New category
        </button>
      </div>
      <div class="bgrid" id="bgrid" data-in></div>
    </section>

    <!-- SUMMARY -->
    <section class="view" id="v-summary" role="tabpanel" aria-label="Summary" hidden>
      <div class="view-h" data-in>
        <h1 class="title">Summary</h1>
        <div class="seg-row" id="months" role="group" aria-label="Month"></div>
      </div>
      <div class="sum-top" id="sumTop" data-in></div>
      <div class="panel" data-in>
        <div class="panel-h"><h2>Day by day</h2><span class="eyebrow" id="dailyMax"></span></div>
        <div class="daily" id="daily"></div>
        <div class="daxis" id="daxis"></div>
      </div>
      <div class="panel" data-in>
        <div class="panel-h"><h2>By category</h2></div>
        <div id="sumBars"></div>
      </div>
    </section>
  </main>
</div>

<!-- EXPENSE SHEET -->
<div class="sheet" id="sheetExp" hidden>
  <div class="sheet-bg" data-close></div>
  <form class="sheet-panel" id="expForm" role="dialog" aria-modal="true" aria-labelledby="expTitle" novalidate>
    <div class="sheet-top"><h2 id="expTitle">New expense</h2><button type="button" class="icon-btn" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="exp-grid">
      <div class="exp-main">
        <div class="amt-wrap" id="amtWrap">
          <label for="eAmt" class="eyebrow">Amount</label>
          <div class="amt-row"><span class="cur">$</span><input id="eAmt" inputmode="decimal" autocomplete="off" placeholder="0.00"></div>
        </div>
        <div class="field">
          <span class="flabel" id="catLbl">Category</span>
          <div class="cat-pick" id="catPick" role="radiogroup" aria-labelledby="catLbl"></div>
          <p class="hint" id="eHint" hidden>You need a category first. <button type="button" class="link" data-act="newCat">Create one</button> or <button type="button" class="link" data-act="sample">load sample data</button>.</p>
        </div>
        <div class="two">
          <div class="field"><label for="eName" class="flabel">What was it?</label><input id="eName" class="inp" placeholder="e.g. Kopi and kaya toast" autocomplete="off"></div>
          <div class="field"><span class="flabel">When</span>
            <div class="when">
              <button type="button" class="seg" data-day="0">Today</button>
              <button type="button" class="seg" data-day="1">Yesterday</button>
              <input type="date" id="eDate" class="inp date" aria-label="Date">
            </div>
          </div>
        </div>
      </div>
      <aside class="impact" id="impact" aria-live="polite"></aside>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary big mag" id="eSave"><span id="eSaveTxt">Drop it in the orb</span><kbd>↵</kbd></button>
    </div>
  </form>
</div>

<!-- CATEGORY SHEET -->
<div class="sheet" id="sheetCat" hidden>
  <div class="sheet-bg" data-close></div>
  <form class="sheet-panel narrow" id="catForm" role="dialog" aria-modal="true" aria-labelledby="catTitle" novalidate>
    <div class="sheet-top"><h2 id="catTitle">New category</h2><button type="button" class="icon-btn" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="field"><label for="cName" class="flabel">Name</label><input id="cName" class="inp" placeholder="e.g. Groceries" autocomplete="off"></div>
    <div class="field"><label for="cBudget" class="flabel">Monthly budget ($)</label><input id="cBudget" class="inp" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
    <div class="field"><span class="flabel" id="swLbl">Colour</span><div class="swatches" id="swatches" role="radiogroup" aria-labelledby="swLbl"></div></div>
    <div class="sheet-foot">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary mag" id="cSave">Add category</button>
    </div>
  </form>
</div>

<!-- COMMAND PALETTE -->
<div class="sheet pal" id="pal" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="pal-panel" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="pal-in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AA8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="palQ" placeholder="Type a command or search expenses" autocomplete="off" aria-controls="palList">
    </div>
    <div class="pal-list" id="palList" role="listbox"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="tdot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#07070B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span><span id="toastTxt"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   State (same storage shape as the original Ledger: ledger-v1)
   ========================================================= */
const KEY = 'ledger-v1';
const PALETTE = ['#FF7A59', '#D7FF3D', '#8B7BFF', '#7CF3FF', '#FFD166', '#FF8FD1', '#6AF0A8', '#FFA94D'];
let S = { cats: [], exps: [], next: 1 };
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) {}
S.cats = S.cats || []; S.exps = S.exps || []; S.next = S.next || 1;
S.cats.forEach((c, i) => { if (!c.color) c.color = PALETTE[i % PALETTE.length]; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => (n < 0 ? '−$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthName = (ym, short) => parse(ym + '-01').toLocaleString('en-US', { month: short ? 'short' : 'long', year: 'numeric' });
const sum = a => a.reduce((t, e) => t + e.amount, 0);
const cat = id => S.cats.find(c => c.id === id) || { name: 'Uncategorised', color: '#6E6E7C', budget: 0 };
const byName = (a, b) => a.name.localeCompare(b.name);
function niceDate(s) {
  const t = today(), y = ymd(new Date(Date.now() - 864e5));
  if (s === t) return 'Today'; if (s === y) return 'Yesterday';
  const d = parse(s), sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleString('en-US', sameYear ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
}
const ICON = {
  edit: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  del: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};

let view = 'overview', editExp = null, editCat = null, pickedCat = null, pickedColor = PALETTE[0];
let filt = { q: '', cat: 0 }, sumMonth = null, booted = false;

/* =========================================================
   Motion helpers
   ========================================================= */
function odo(el, n) {
  const str = money(n), cut = str.indexOf('.');
  const sig = str.replace(/\d/g, '0');
  if (el.dataset.sig !== sig) {
    el.dataset.sig = sig;

    if (performance.now() > pinUntil) hover = ptr.inside && !drag ? pick() : -1;
    sats.forEach((s, i) => {
      const on = i === hover;
      s.ang += dt * s.sp * (on ? .12 : 1);            // a hovered moon slows almost to a stop
      s.grow += ((on ? 1.45 : 1) - s.grow) * .18; s.moon.scale.setScalar(s.grow);
      s.lineMat.uniforms.uBoost.value += ((on ? 1 : 0) - s.lineMat.uniforms.uBoost.value) * .15;
      const a = s.ang;
      s.moon.position.set(Math.cos(a) * s.r, 0, Math.sin(a) * s.r);
      s.moon.rotation.y = t * .8;
      s.trail.forEach((sp, k) => { const b = a - (k + 1) * .045; sp.position.set(Math.cos(b) * s.r, 0, Math.sin(b) * s.r); });
      s.lineMat.uniforms.uHead.value = (a / (Math.PI * 2)) % 1;
      s.lineMat.uniforms.uCamZ.value = cam.position.z;
    });
    R.render(scene, cam);
    showTip();
  }

  function set(pct, list) {
    target = pct;
    colTarget = new THREE.Color(pct > 1 ? '#FF7A59' : '#D7FF3D');
    if (ok) setSats(list);
    $('orbLiq').style.setProperty('--lvl', Math.min(pct, 1) * 100 + '%');
  }
  function splash() { slosh = 1; vel += .02; }
  return { init, set: (p, l) => { if (window.THREE) set(p, l); else $('orbLiq').style.setProperty('--lvl', Math.min(p, 1) * 100 + '%'); }, splash };
})();

/* =========================================================
   Rendering
   ========================================================= */
function monthData(ym) {
  const ex = S.exps.filter(e => e.date.startsWith(ym));
  const per = S.cats.map(c => ({ c, spent: sum(ex.filter(e => e.cat === c.id)) }));
  return { ex, spent: sum(ex), per };
}

function render() {
  renderOverview(); renderExpenses(); renderBudgets(); renderSummary(); renderCatPick();
}

function renderOverview() {
  const ym = today().slice(0, 7), d = new Date().getDate(), days = dim(ym);
  const { ex, spent, per } = monthData(ym);
  const budget = S.cats.reduce((a, c) => a + c.budget, 0), pct = budget > 0 ? spent / budget : 0;
  $('monthChip').textContent = `${monthName(ym)} · Day ${d} of ${days}`;
  odo($('heroNum'), spent);
  const chip = $('pctChip');
  chip.textContent = budget > 0 ? `${(pct * 100).toFixed(1)}% of ${money0(budget)}` : 'No budgets set';
  chip.classList.toggle('over', pct > 1);
  const left = budget - spent, dl = days - d + 1;
  $('heroSub').textContent = budget > 0
    ? (left >= 0 ? `${money(left)} left · about ${money0(left / dl)} a day for ${dl} day${dl > 1 ? 's' : ''}` : `${money(-left)} over budget`)
    : (S.cats.length ? 'Give categories a budget to track your pace' : 'Create a category to get started');
  $('meterFill').style.width = Math.min(pct, 1) * 100 + '%';
  $('meterFill').classList.toggle('over', pct > 1);
  $('meterPace').style.left = (d / days * 100) + '%';
  $('paceLbl').textContent = `even pace · ${Math.round(d / days * 100)}%`;
  $('budgetLbl').textContent = money0(budget);
  $('orbCap').textContent = budget > 0 ? `${Math.round(pct * 100)}% full · drag to spin · hover a moon` : 'set a budget to fill it';
  Orb.set(pct, per.filter(p => p.spent > 0).map(p => ({ name: p.c.name, amt: p.spent, color: p.c.color, share: spent ? p.spent / spent : 0 })));

  // stats with 14-day sparks
  const last = [...Array(14)].map((_, i) => ymd(new Date(Date.now() - (13 - i) * 864e5)));
  const daily = last.map(s => sum(S.exps.filter(e => e.date === s)));
  const counts = last.map(s => S.exps.filter(e => e.date === s).length);
  const dayTotals = {}; ex.forEach(e => dayTotals[e.date] = (dayTotals[e.date] || 0) + e.amount);
  const big = Object.entries(dayTotals).sort((a, b) => b[1] - a[1])[0];
  const spark = (vals, hiIdx) => { const m = Math.max(...vals, 1); return `<div class="spark">${vals.map((v, j) => `<i style="--j:${j};height:${Math.max(8, v / m * 100)}%" class="${j === hiIdx ? 'hi' : ''}"></i>`).join('')}</div>`; };
  const maxIdx = daily.indexOf(Math.max(...daily));
  const cards = [
    ['Remaining', budget - spent, money, budget > 0 ? `of ${money0(budget)}` : 'no budget', spark(daily.map((_, i) => Math.max(0, budget - sum(S.exps.filter(e => e.date.startsWith(ym) && e.date <= last[i])))), 13)],
    ['Daily average', spent / d, money, `${d} day${d > 1 ? 's' : ''} in`, spark(daily, 13)],
    ['Expenses logged', ex.length, n => String(Math.round(n)), 'this month', spark(counts, 13)],
    ['Biggest day', big ? big[1] : 0, money, big ? niceDate(big[0]) : '—', spark(daily, maxIdx)],
  ];
  const st = $('stats');
  if (st.children.length !== 4) {
    st.innerHTML = cards.map((c, i) => `<div class="stat tilt" data-in style="--i:${i + 5}"><div class="stat-top"><span>${c[0]}</span><span class="mono"></span></div><div class="stat-num"></div><div class="sp"></div></div>`).join('');

  $('viewAll').textContent = sorted.length ? `View all ${sorted.length}` : '';
  $('recent').innerHTML = !S.cats.length
    ? `<div class="welcome"><p>Ledger tracks spending against a monthly budget per category. Start with a category, or load a few months of sample data to see everything move.</p><div class="row"><button class="btn primary mag" data-act="newCat">Create a category</button><button class="btn ghost" data-act="sample">Load sample data</button></div></div>`
    : sorted.length
      ? sorted.slice(0, 6).map(rowHTML).join('')

  // where it went
  const used = per.filter(p => p.spent > 0).sort((a, b) => b.spent - a.spent);
  const overs = per.filter(p => p.c.budget > 0 && p.spent > p.c.budget);
  $('where').innerHTML = used.length
    ? `<div class="stack">${used.map((p, j) => `<i style="--j:${j};flex:${p.spent};background:${p.c.color}"></i>`).join('')}</div>
       <div class="legend">${used.map(p => `<div class="lg" style="--c:${p.c.color}"><span class="sw"></span><span class="n">${esc(p.c.name)}</span><span class="p">${(p.spent / spent * 100).toFixed(1)}%</span><span class="a">${money(p.spent)}</span></div>`).join('')}</div>
       ${overs.length
         ? overs.map(p => `<div class="alert">${esc(p.c.name)} is ${money(p.spent - p.c.budget)} over budget${dl > 1 ? ` with ${dl} days to go` : ''}.</div>`).join('')
         : budget > 0 ? `<div class="ok-note">Every category is within budget.</div>` : ''}`
    : `<p class="empty">Nothing spent in ${monthName(ym)} yet.</p>`;
}

function rowHTML(e) {

function renderBudgets() {

function renderSummary() {
  const cur = today().slice(0, 7);
  const months = [...new Set([cur, ...S.exps.map(e => e.date.slice(0, 7))])].sort().reverse();
  if (!sumMonth || !months.includes(sumMonth)) sumMonth = cur;
  $('months').innerHTML = months.map(m => `<button class="mbtn" data-month="${m}" aria-pressed="${m === sumMonth}">${monthName(m, true)}</button>`).join('');

function moveInd() {
  const b = document.querySelector(`.nav-btn[data-view="${view}"]`);
  if (!b) return;
  $('navInd').style.width = b.offsetWidth + 'px';
  $('navInd').style.transform = `translateX(${b.offsetLeft}px)`;
}
function showView(name, instant) {
  document.querySelectorAll('.nav-btn').forEach(b => b.setAttribute('aria-selected', b.dataset.view === name));
  const prev = $('v-' + view), next = $('v-' + name);
  const enter = () => {
    document.querySelectorAll('.view').forEach(v => { v.hidden = v !== next; v.classList.remove('leaving', 'entering'); });
    next.querySelectorAll('[data-in]').forEach((el, i) => el.style.setProperty('--i', el.style.getPropertyValue('--i') || i));
    if (!RM) { void next.offsetWidth; next.classList.add('entering'); setTimeout(() => next.classList.remove('entering'), 1600); }
    if (name === 'budgets') { renderBudgets(); $('bgrid').querySelectorAll('.bcard.over').forEach(c => c.classList.add('shake')); }
    if (name === 'summary') renderSummary();
  };
  view = name; moveInd();
  if (instant || RM || prev === next) return enter();
  prev.classList.add('leaving'); setTimeout(enter, 200);
  scrollTo({ top: 0, behavior: 'smooth' });
}

  }).join('');

function renderImpact() {
  const amt = parseFloat($('eAmt').value) || 0, c = S.cats.find(x => x.id === pickedCat);
  if (!c) { $('impact').innerHTML = '<span class="eyebrow">Live impact</span><p class="hint">Pick a category to see how this lands.</p>'; return; }
  const date = $('eDate').value || today(), ym = date.slice(0, 7);
  const prev = editExp ? S.exps.find(e => e.id === editExp) : null;
  const base = sum(S.exps.filter(e => e.cat === c.id && e.date.startsWith(ym) && e.id !== editExp));
  const after = base + amt, r = c.budget > 0 ? after / c.budget : 0, CC = 2 * Math.PI * 40;
  const monthAfter = sum(S.exps.filter(e => e.date.startsWith(ym) && e.id !== editExp)) + amt;
  const budget = S.cats.reduce((a, x) => a + x.budget, 0);
  const isCur = ym === today().slice(0, 7), dl = isCur ? dim(ym) - new Date().getDate() + 1 : 0;
  const over = c.budget > 0 && after > c.budget;
  const note = c.budget > 0
    ? (over ? `This puts ${esc(c.name)} ${money(after - c.budget)} over its ${money0(c.budget)} budget.` : `${money(c.budget - after)} of ${money0(c.budget)} still free after this.`)
    : `${esc(c.name)} has no budget yet.`;
  const ring = $('impRing');
  const html = `<span class="eyebrow">Live impact · ${monthName(ym)}</span>
    <div class="imp-row"><div class="imp-ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="#1F1F2A" stroke-width="9"/><circle class="val" id="impRing" cx="48" cy="48" r="40" fill="none" stroke="${over ? '#FF7A59' : c.color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${CC}" stroke-dashoffset="${ring ? ring.style.strokeDashoffset || CC : CC}"/></svg><b>${c.budget > 0 ? Math.round(r * 100) + '%' : '—'}</b></div>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="imp-name">${esc(c.name)}</span><span class="imp-note${over ? ' over' : ''}">${note}</span></div></div>
    <div class="hr"></div>
    <div class="kv"><span>Month total after this</span><span>${money(monthAfter)}</span></div>
    ${budget > 0 && isCur ? `<div class="kv"><span>Safe daily spend</span><span>${money(Math.max(0, budget - monthAfter) / dl)}</span></div>` : ''}
    ${prev ? `<div class="kv"><span>Was</span><span>${money(prev.amount)}</span></div>` : ''}`;
  $('impact').innerHTML = html;
  requestAnimationFrame(() => { const v = $('impRing'); if (v) v.style.strokeDashoffset = CC * (1 - Math.min(r, 1)); });
}

$('eAmt').addEventListener('input', () => {

  ev.preventDefault();
  const rec = { cat: pickedCat, amount: Math.round(parseFloat($('eAmt').value) * 100) / 100, date: $('eDate').value, note: $('eName').value.trim() };
  if (!S.cats.some(c => c.id === rec.cat)) return toast('Pick a category first.');
  if (!(rec.amount > 0)) { const w = $('amtWrap'); w.classList.remove('bad'); void w.offsetWidth; w.classList.add('bad'); $('eAmt').focus(); return toast('Enter an amount above zero.'); }
  if (!rec.date) return toast('Pick a date.');
  const wasEdit = !!editExp, color = cat(rec.cat).color;
  if (editExp) Object.assign(S.exps.find(e => e.id === editExp), rec);
  else S.exps.push({ id: S.next++, ...rec });
  save();
  const r = $('eSave').getBoundingClientRect(), from = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  closeSheet('sheetExp', true);
  if (wasEdit) { render(); return toast('Expense updated.'); }
  const land = () => { render(); Orb.splash(); toast(`${money(rec.amount)} added to ${cat(rec.cat).name}.`); };
  const away = view !== 'overview' || scrollY > 40;
  if (view !== 'overview') showView('overview'); else scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => flyCoin(from, color, land), away ? 520 : 120);
});

$('catForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const name = $('cName').value.trim(), budget = Math.max(0, parseFloat($('cBudget').value) || 0);
  if (!name) { $('cName').focus(); return toast('Name can\'t be empty.'); }
  if (S.cats.some(c => c.id !== editCat && c.name.toLowerCase() === name.toLowerCase())) return toast('That category already exists.');
  if (editCat) Object.assign(S.cats.find(c => c.id === editCat), { name, budget, color: pickedColor });
  else { const id = S.next++; S.cats.push({ id, name, budget, color: pickedColor }); pickedCat = id; }
  toast(editCat ? 'Category updated.' : `${name} added.`);
  save(); closeSheet('sheetCat'); render();
});

$('q').addEventListener('input', () => { filt.q = $('q').value; renderExpenses(); });

/* =========================================================
   Sample data
   ========================================================= */
function loadSample() {
  const defs = [['Dining', 420], ['Groceries', 520], ['Transport', 220], ['Home', 380], ['Fun', 180]];
  defs.forEach(([name, budget], i) => { if (!S.cats.some(c => c.name.toLowerCase() === name.toLowerCase())) S.cats.push({ id: S.next++, name, budget, color: PALETTE[i] }); });
  const id = n => S.cats.find(c => c.name.toLowerCase() === n.toLowerCase()).id;
  const items = {
    Dining: [['Kopi and kaya toast', 6.4], ['Chicken rice', 5.5], ['Laksa at the hawker centre', 7.8], ['Team lunch', 38], ['Omakase dinner', 168], ['Bubble tea', 6.2], ['Brunch with friends', 54]],
    Groceries: [['FairPrice weekly shop', 84.15], ['Cold Storage top-up', 32.6], ['Fruit and veg', 18.4], ['Bakery', 12.9]],
    Transport: [['Grab ride', 14.8], ['MRT top-up', 30], ['Taxi home', 22.5], ['Bike share', 3.2]],
    Home: [['Electricity bill', 92.33], ['Internet', 49.9], ['Cleaning supplies', 21.4], ['Desk lamp', 45]],
    Fun: [['Cinema, two tickets', 31], ['Concert ticket', 98], ['Bouldering session', 26], ['Book', 24.9]],
  };
  let seed = 20261009; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const now = new Date();
  for (let mo = 2; mo >= 0; mo--) {
    const y = now.getFullYear(), m = now.getMonth() - mo, d0 = new Date(y, m, 1), last = mo ? new Date(y, m + 1, 0).getDate() : now.getDate();
    for (let d = 1; d <= last; d++) {
      const n = rnd() < .15 ? 0 : rnd() < .45 ? 1 : rnd() < .8 ? 2 : 3;
      for (let k = 0; k < n; k++) {
        const cn = Object.keys(items)[Math.floor(rnd() * 5)], pool = items[cn], [note, amt] = pool[Math.floor(rnd() * pool.length)];
        if (cn === 'Home' && rnd() < .5) continue;
        S.exps.push({ id: S.next++, cat: id(cn), amount: Math.round(amt * (0.85 + rnd() * .3) * 100) / 100, date: ymd(new Date(d0.getFullYear(), d0.getMonth(), d)), note });
      }
    }
  }
  save(); render(); Orb.splash(); toast('Sample data loaded.');
}

/* =========================================================
   Command palette
   ========================================================= */
let palSel = 0, palItems = [];
function palRender() {
  const q = $('palQ').value.trim().toLowerCase();
  const acts = [
    { g: 'Actions', label: 'New expense', k: 'N', run: () => openExp() },
    { g: 'Actions', label: 'New category', run: () => openCat() },
    { g: 'Go to', label: 'Overview', run: () => showView('overview') },
    { g: 'Go to', label: 'Expenses', run: () => showView('expenses') },
    { g: 'Go to', label: 'Budgets', run: () => showView('budgets') },
    { g: 'Go to', label: 'Summary', run: () => showView('summary') },
  ];
  if (!S.exps.length) acts.push({ g: 'Actions', label: 'Load sample data', run: loadSample });
  const hits = q ? S.exps.filter(e => (e.note || '').toLowerCase().includes(q) || cat(e.cat).name.toLowerCase().includes(q))
    .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8)
    .map(e => ({ g: 'Expenses', label: e.note || 'Untitled', k: `${money(e.amount)} · ${niceDate(e.date)}`, c: cat(e.cat).color, run: () => openExp(e.id) })) : [];
  palItems = [...acts.filter(a => !q || a.label.toLowerCase().includes(q)), ...hits];
  palSel = Math.min(palSel, Math.max(palItems.length - 1, 0));
  let g = '';
  $('palList').innerHTML = palItems.length ? palItems.map((it, i) => {
    const h = it.g !== g ? `<div class="pal-g">${it.g}</div>` : ''; g = it.g;
    return h + `<button class="pi" role="option" data-pi="${i}" aria-selected="${i === palSel}" ${it.c ? `style="--c:${it.c}"` : ''}><span class="sw"></span>${esc(it.label)}${it.k ? `<span class="k">${esc(it.k)}</span>` : ''}</button>`;
  }).join('') : '<p class="empty" style="padding:14px">Nothing found.</p>';
}
function openPal() { $('palQ').value = ''; palSel = 0; palRender(); openSheet('pal', $('palQ')); }
function runPal(i) { const it = palItems[i]; if (!it) return; closeSheet('pal', true); setTimeout(it.run, 120); }
$('palQ').addEventListener('input', () => { palSel = 0; palRender(); });
$('palQ').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); palSel = (palSel + (e.key === 'ArrowDown' ? 1 : -1) + palItems.length) % Math.max(palItems.length, 1); palRender();
    const s = $('palList').querySelector('[aria-selected=true]'); s && s.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter') { e.preventDefault(); runPal(palSel); }
});

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-view],[data-go],[data-act],[data-close],[data-pick],[data-sw],[data-day],[data-fcat],[data-month],[data-pi]');
  if (!t) return;
  const d = t.dataset;
  if (d.view) return showView(d.view);
  if (d.go) return showView(d.go);
  if ('close' in d) return closeSheet(t.closest('.sheet').id);
  if (d.pick) { pickedCat = +d.pick; document.querySelectorAll('.cp').forEach(b => b.setAttribute('aria-checked', b === t)); return renderImpact(); }
  if (d.sw) { pickedColor = d.sw; return document.querySelectorAll('.swb').forEach(b => b.setAttribute('aria-checked', b === t)); }
  if (d.day) { setDay(ymd(new Date(Date.now() - d.day * 864e5))); return renderImpact(); }
  if (d.fcat !== undefined) { filt.cat = +d.fcat; renderExpenses(); return stagger($('expList')); }
  if (d.month) { sumMonth = d.month; renderSummary(); return stagger($('daily')); }
  if (d.pi) return runPal(+d.pi);

  const id = +d.id, act = d.act;
  if (act === 'newExp') return openExp();
  if (act === 'newCat') { closeSheet('sheetExp', true); return setTimeout(() => openCat(), $('sheetExp').hidden ? 0 : 200); }
  if (act === 'sample') { closeSheet('sheetExp', true); return loadSample(); }
  if (act === 'palette') return openPal();
  if (act === 'editExp') return openExp(id);
  if (act === 'editCat') return openCat(id);
  if (act === 'delExp' || act === 'delCat') {   // two-step delete: first click arms, second confirms
    if (!t.classList.contains('armed')) {
      t.classList.add('armed'); t.setAttribute('aria-label', 'Click again to delete');
      t.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 350, easing: 'cubic-bezier(.34,1.56,.64,1)' });
      toast('Click again to delete.');
      return void setTimeout(() => t.classList.remove('armed'), 2500);
    }
    if (act === 'delCat' && S.exps.some(x => x.cat === id)) return toast('This category still has expenses. Move or delete them first.');
    const el = t.closest('.erow,.bcard');
    const finish = () => {
      if (act === 'delExp') { S.exps = S.exps.filter(x => x.id !== id); toast('Expense deleted.'); }
      else { S.cats = S.cats.filter(x => x.id !== id); toast('Category deleted.'); }
      save(); render();
    };
    if (!el || RM) return finish();
    const h = el.offsetHeight;
    el.style.overflow = 'hidden';
    el.animate([
      { opacity: 1, transform: 'none', height: h + 'px', marginBottom: '0px' },
      { opacity: 0, transform: 'translateX(40px) scale(.96)', height: h + 'px', offset: .5 },
      { opacity: 0, transform: 'translateX(40px) scale(.96)', height: act === 'delExp' ? '0px' : h + 'px', paddingTop: '0px', paddingBottom: '0px', marginBottom: act === 'delExp' ? '-4px' : '0px' },
    ], { duration: 480, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' }).onfinish = finish;
  }
});

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('pal').hidden ? openPal() : closeSheet('pal'); }
  if (e.key === 'Escape') { const s = openSheetId(); if (s) { e.preventDefault(); closeSheet(s); } return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || openSheetId()) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openExp(); }
  const map = { 1: 'overview', 2: 'expenses', 3: 'budgets', 4: 'summary' };
  if (map[e.key]) showView(map[e.key]);
});
// keep focus inside an open sheet
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const s = openSheetId(); if (!s) return;
  const f = [...$(s).querySelectorAll('button,input,[tabindex]')].filter(x => !x.disabled && x.offsetParent);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});

addEventListener('resize', moveInd);
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('kbdHint').textContent = 'Ctrl K';

/* =========================================================
   Boot
   ========================================================= */
Orb.init();
showView('overview', true);
render();
document.fonts && document.fonts.ready.then(moveInd);
setTimeout(moveInd, 300);
</script>
